<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Terminal: a checklist of agents with Claude Code, Codex CLI and Cursor ticked, then the installer installs broll-finder into those three">
  <rect width="1000" height="560" rx="12" fill="#0d0f14" stroke="#2b3246"/>
  <rect width="1000" height="38" rx="12" fill="#1d2230"/>
  <rect y="26" width="1000" height="12" fill="#1d2230"/>
  <circle cx="24" cy="19" r="6.5" fill="#e0565b"/>
  <circle cx="46" cy="19" r="6.5" fill="#f5b83d"/>
  <circle cx="68" cy="19" r="6.5" fill="#5cc28a"/>
  <text x="500" y="24" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7b849c">bash</text>

  <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15">
    <text x="24" y="72"><tspan fill="#5cc28a">$</tspan><tspan fill="#f4f5f8"> curl -fsSL https://raw.githubusercontent.com/axel0806/broll-finder-SKILL/main/install.sh | sh</tspan></text>

    <text x="24" y="106" fill="#f4f5f8" font-weight="700">Install broll-finder into which agents?</text>
    <text y="128" fill="#6f7891"><tspan x="24">up/down or j/k: move</tspan><tspan x="230">space: select</tspan><tspan x="372">a: all</tspan><tspan x="448">enter: continue</tspan><tspan x="602">q: cancel</tspan></text>

    <text y="156"><tspan x="40" fill="#5cc28a">[x]</tspan><tspan x="80" fill="#dfe3ee">Claude Code</tspan><tspan x="268" fill="#5cc28a">detected</tspan></text>
    <text y="178"><tspan x="40" fill="#5cc28a">[x]</tspan><tspan x="80" fill="#dfe3ee">Codex CLI</tspan><tspan x="268" fill="#5cc28a">detected</tspan></text>
    <text y="200"><tspan x="40" fill="#aab2c8">[ ]</tspan><tspan x="80" fill="#aab2c8">Gemini CLI</tspan><tspan x="268" fill="#6f7891">not found</tspan></text>
    <text y="222"><tspan x="40" fill="#aab2c8">[ ]</tspan><tspan x="80" fill="#aab2c8">GitHub Copilot CLI</tspan><tspan x="268" fill="#6f7891">not found</tspan></text>
    <rect x="74" y="229" width="184" height="22" fill="#c9ced9"/>
    <text y="245"><tspan x="24" fill="#f4f5f8" font-weight="700">&gt;</tspan><tspan x="40" fill="#5cc28a">[x]</tspan><tspan x="80" fill="#0d0f14">Cursor</tspan><tspan x="268" fill="#5cc28a">detected</tspan></text>
    <text y="268"><tspan x="40" fill="#aab2c8">[ ]</tspan><tspan x="80" fill="#aab2c8">OpenCode</tspan><tspan x="268" fill="#6f7891">not found</tspan></text>
    <text y="290"><tspan x="40" fill="#aab2c8">[ ]</tspan><tspan x="80" fill="#aab2c8">Goose</tspan><tspan x="268" fill="#6f7891">not found</tspan></text>
    <text y="312"><tspan x="40" fill="#aab2c8">[ ]</tspan><tspan x="80" fill="#aab2c8">Generic (~/.agents)</tspan><tspan x="268" fill="#6f7891">not found</tspan></text>

    <text x="24" y="346" fill="#aab2c8">Source: https://raw.githubusercontent.com/.../broll-finder/SKILL.md</text>
    <text x="24" y="370" fill="#f4f5f8" font-weight="700">Installing broll-finder</text>
    <text y="394"><tspan x="40" fill="#5cc28a">ok</tspan><tspan x="99" fill="#dfe3ee">install</tspan><tspan x="173" fill="#dfe3ee">Claude Code (~/.claude/skills/broll-finder)</tspan></text>
    <text y="418"><tspan x="40" fill="#5cc28a">ok</tspan><tspan x="99" fill="#dfe3ee">install</tspan><tspan x="173" fill="#dfe3ee">Codex CLI (~/.codex/skills/broll-finder)</tspan></text>
    <text y="442"><tspan x="40" fill="#5cc28a">ok</tspan><tspan x="99" fill="#dfe3ee">install</tspan><tspan x="173" fill="#dfe3ee">Cursor (~/.cursor/skills/broll-finder)</tspan></text>
    <text x="24" y="466" fill="#dfe3ee">Done: 3 installed, 0 replaced, 0 skipped.</text>
    <text x="24" y="490" fill="#f4f5f8" font-weight="700">Checking dependencies on PATH</text>
    <text y="514"><tspan x="40" fill="#5cc28a">ok</tspan><tspan x="99" fill="#dfe3ee">found</tspan><tspan x="173" fill="#dfe3ee">yt-dlp, ffmpeg, ffprobe</tspan></text>
    <text x="24" y="540"><tspan fill="#5cc28a">$</tspan><tspan fill="#f4f5f8"> &#9608;</tspan></text>
  </g>
</svg>
