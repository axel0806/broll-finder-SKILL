<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="broll-finder: ask your coding agent for b-roll, get edit-ready 1080p clips">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161c"/>
      <stop offset="1" stop-color="#1d2230"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3246"/>
      <stop offset="1" stop-color="#232838"/>
    </linearGradient>
    <pattern id="holes" width="36" height="22" patternUnits="userSpaceOnUse">
      <rect x="10" y="6" width="16" height="10" rx="2.5" fill="#14161c"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- film strip -->
  <g transform="translate(0 292)">
    <rect width="1280" height="108" fill="#0d0f14"/>
    <rect y="0" width="1280" height="22" fill="url(#holes)" opacity="0.9"/>
    <rect y="86" width="1280" height="22" fill="url(#holes)" opacity="0.9"/>
    <g fill="url(#frame)" stroke="#3a4360" stroke-width="1">
      <rect x="18" y="26" width="104" height="56" rx="3"/>
      <rect x="134" y="26" width="104" height="56" rx="3"/>
      <rect x="250" y="26" width="104" height="56" rx="3"/>
      <rect x="366" y="26" width="104" height="56" rx="3"/>
      <rect x="482" y="26" width="104" height="56" rx="3"/>
      <rect x="598" y="26" width="104" height="56" rx="3"/>
      <rect x="714" y="26" width="104" height="56" rx="3"/>
      <rect x="830" y="26" width="104" height="56" rx="3"/>
      <rect x="946" y="26" width="104" height="56" rx="3"/>
      <rect x="1062" y="26" width="104" height="56" rx="3"/>
      <rect x="1178" y="26" width="104" height="56" rx="3"/>
    </g>
    <!-- selected (kept) frames -->
    <g fill="none" stroke="#f5b83d" stroke-width="3">
      <rect x="250" y="26" width="104" height="56" rx="3"/>
      <rect x="598" y="26" width="104" height="56" rx="3"/>
      <rect x="946" y="26" width="104" height="56" rx="3"/>
    </g>
    <g fill="#f5b83d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">
      <text x="302" y="59" text-anchor="middle">1080p</text>
      <text x="650" y="59" text-anchor="middle">1080p</text>
      <text x="998" y="59" text-anchor="middle">1080p</text>
    </g>
    <!-- skipped frames -->
    <g stroke="#e0565b" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <path d="M402 40 l32 28 M434 40 l-32 28"/>
      <path d="M866 40 l32 28 M898 40 l-32 28"/>
    </g>
  </g>

  <!-- play glyph -->
  <g transform="translate(96 92)">
    <rect width="112" height="112" rx="26" fill="#f5b83d"/>
    <path d="M44 32 L84 56 L44 80 Z" fill="#14161c"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="240" y="150" font-size="68" font-weight="800" fill="#f4f5f8" letter-spacing="-1">broll-finder</text>
    <text x="242" y="196" font-size="26" fill="#aab2c8">Ask your coding agent for b-roll. Get edit-ready 1080p clips.</text>
  </g>

  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <g transform="translate(242 222)">
      <rect width="84" height="32" rx="16" fill="#262c3d" stroke="#3a4360"/>
      <text x="42" y="21.5" text-anchor="middle" fill="#dfe3ee">yt-dlp</text>
    </g>
    <g transform="translate(336 222)">
      <rect width="88" height="32" rx="16" fill="#262c3d" stroke="#3a4360"/>
      <text x="44" y="21.5" text-anchor="middle" fill="#dfe3ee">ffmpeg</text>
    </g>
    <g transform="translate(434 222)">
      <rect width="128" height="32" rx="16" fill="#262c3d" stroke="#3a4360"/>
      <text x="64" y="21.5" text-anchor="middle" fill="#dfe3ee">Claude Code</text>
    </g>
    <g transform="translate(572 222)">
      <rect width="80" height="32" rx="16" fill="#262c3d" stroke="#3a4360"/>
      <text x="40" y="21.5" text-anchor="middle" fill="#dfe3ee">Codex</text>
    </g>
    <g transform="translate(662 222)">
      <rect width="86" height="32" rx="16" fill="#262c3d" stroke="#3a4360"/>
      <text x="43" y="21.5" text-anchor="middle" fill="#dfe3ee">Cursor</text>
    </g>
    <g transform="translate(758 222)">
      <rect width="122" height="32" rx="16" fill="#262c3d" stroke="#3a4360"/>
      <text x="61" y="21.5" text-anchor="middle" fill="#dfe3ee">+ 4 more</text>
    </g>
  </g>
</svg>
